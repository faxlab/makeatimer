name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          PUBLIC_LAUNCH_READY: 'false'
          PUBLIC_ADS_ENABLED: 'false'
          PUBLIC_WEB_ANALYTICS_ENABLED: 'false'
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run browser-check
      - run: npm run ad-check
      - run: npm run analytics-check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-screenshots
          path: output/playwright/
